[package]
name = "hybrid-esp"
version = "0.1.0"
edition = "2024"

[dependencies]
# GUI
eframe      = { version = "0.31", features = ["default"] }
egui        = "0.31"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Serial communication
serialport  = "4.5"

# Logging
log         = "0.4"
env_logger  = "0.11"

# Time
chrono      = { version = "0.4", features = ["serde"] }

# UUID for log sessions
uuid        = { version = "1", features = ["v4", "serde"] }

# Path for file operations
directories = "5"

# 3D math / vector ops
approx = "0.5"

# Error handling
thiserror = "2"

# Git info (optional, for logger fallback)
git2 = "0.20"

# Native file picker
rfd = { version = "0.15", features = ["xdg-portal"] }

# Parsers
acadrust = "0.5.5"
gds21 = "0.2.0"
